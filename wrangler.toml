# Cloudflare Workers 部署配置（vps.raenzo.com 线上实例）
# 密钥不在此文件中：API_SECRET 通过 `wrangler secret put` 管理
# 用法: npm run build:frontend && npx wrangler deploy
# 本地开发: cp wrangler.toml wrangler.dev.toml 并按需调整，或直接 wrangler dev 使用本配置
name = "server-monitor-pro"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 自定义域名绑定（自动创建 DNS 记录 + 免费证书）
routes = [
  { pattern = "vps.raenzo.com", custom_domain = true }
]

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改 index.js scheduled 函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "1ef879f0-276c-410f-8a37-d9e6dfc86f46"

# Durable Objects：实时指标广播中心
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

[vars]
API_USER_NAME = "admin"
CORS_ALLOWED_ORIGINS = "https://vps.raenzo.com"

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
